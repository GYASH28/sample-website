name: Update React Router lockfile

on:
  push:
    branches:
      - security/pin-react-router-7-11

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/pin-react-router-7-11

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pin safe React Router release
        run: npm install react-router-dom@7.11.0 --save-exact

      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit regenerated dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: pin React Router to audited safe 7.x release"
          git push
