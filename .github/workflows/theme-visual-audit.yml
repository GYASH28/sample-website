name: Theme visual audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  theme-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build site
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/theme-audit-preview.log 2>&1 &
          echo $! > /tmp/theme-audit-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/theme-audit-preview.log
          exit 1

      - name: Render and audit light/dark themes
        run: node theme-visual-audit.cjs

      - name: Upload rendered theme audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visual-audit
          path: theme-audit-artifacts
          if-no-files-found: error
          retention-days: 3

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/theme-audit-preview.pid ]; then
            kill "$(cat /tmp/theme-audit-preview.pid)" || true
          fi
