name: Validate Fakhri Mart production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/cinematic-main-consolidation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-fakhri-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and prerender
        run: npm run build

      - name: Start persistent preview server
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/fakhri-preview.log 2>&1 &
          echo $! > /tmp/fakhri-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fakhri-preview.log
          exit 1

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Run cinematic intro and scroll tests
        run: npm run test:cinematic

      - name: Run accessibility audit
        run: npm run test:a11y

      - name: Run viewport integrity tests
        run: npm run test:viewports

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/fakhri-preview.pid ]; then
            kill "$(cat /tmp/fakhri-preview.pid)" || true
          fi
