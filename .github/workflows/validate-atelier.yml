name: Validate atelier website

on:
  pull_request:
    branches:
      - codex/fakhri-mart-redesign
  push:
    branches:
      - feature/atelier-maps-seo-intro
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-atelier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and prerender
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Run accessibility audit
        run: npm run test:a11y

      - name: Run viewport integrity tests
        run: npm run test:viewports
