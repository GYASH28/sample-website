name: Validate Fakhri Mart production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feature/cinematic-main-consolidation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-fakhri-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity dependencies
        run: npm run test:deps

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build and prerender public routes
        run: npm run build:prerender

      - name: Start persistent preview server
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/fakhri-preview.log 2>&1 &
          echo $! > /tmp/fakhri-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fakhri-preview.log
          exit 1

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Run cinematic intro and scroll tests
        run: npm run test:cinematic

      - name: Run motion lifecycle tests
        run: npm run test:motion

      - name: Run FAQ interaction tests
        run: npm run test:faq

      - name: Run accessibility audit
        run: npm run test:a11y

      - name: Run viewport and mobile integrity tests
        run: npm run test:viewports

      - name: Run discovery and conversion regression
        run: npm run test:discovery

      - name: Run SEO and business identity integrity
        run: npm run test:seo

      - name: Run bundle and scroll performance budgets
        run: npm run test:performance

      - name: Profile opening-sequence performance
        run: npm run audit:intro -- http://127.0.0.1:4173 intro-performance-report.json

      - name: Profile route motion performance
        run: npm run audit:motion -- http://127.0.0.1:4173 motion-performance-report.json

      - name: Run light and dark theme visual regression
        run: npm run test:theme

      - name: Upload performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-diagnostics
          path: |
            intro-performance-report.json
            motion-performance-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload theme visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-theme-visual-audit
          path: theme-audit-artifacts
          if-no-files-found: warn
          retention-days: 3

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/fakhri-preview.pid ]; then
            kill "$(cat /tmp/fakhri-preview.pid)" || true
          fi
