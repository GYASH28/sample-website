name: Apply verified Nano ID lock patch

on:
  push:
    branches: [optimize/ux-seo-performance-v13]
    paths:
      - .github/workflows/remediate-nanoid-lock.yml

permissions:
  contents: write

jobs:
  remediate-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: optimize/ux-seo-performance-v13

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current lockfile
        run: npm ci

      - name: Apply npm audit lockfile-only remediation
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Verify remediation is Nano ID 3.3.18 only
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const nanoid = lock.packages?.['node_modules/nanoid'];
          if (nanoid?.version !== '3.3.18') {
            throw new Error(`Expected nanoid 3.3.18, found ${nanoid?.version || 'missing'}`);
          }
          NODE
          git diff -- package-lock.json

      - name: Commit exact registry patch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: patch nanoid to 3.3.18"
          git push origin HEAD:optimize/ux-seo-performance-v13
