name: Motion performance v5 benchmark

on:
  pull_request:
    branches:
      - main

jobs:
  benchmark:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-main
            ref: main
          - label: refined-v5
            ref: refine/intro-motion-performance-v5

    steps:
      - name: Checkout comparison ref
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/fakhri-preview.log 2>&1 &
          echo $! > /tmp/fakhri-preview.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fakhri-preview.log
          exit 1

      - name: Run motion audit
        run: node src/scripts/motion-audit.mjs http://127.0.0.1:4173 /tmp/motion.json

      - name: Print benchmark summary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('/tmp/motion.json', 'utf8'));
          const focus = report.results.filter((row) => ['/', '/products', '/products/makhhi-thread'].includes(row.route));
          const average = (key) => focus.reduce((sum, row) => sum + Number(row[key] || 0), 0) / Math.max(focus.length, 1);
          console.log(JSON.stringify({
            label: process.env.BENCHMARK_LABEL,
            samples: focus.map(({ profile, route, frameP95, frameMax, framesOver33, framesOver50, longTaskMax, lcp, cls }) => ({ profile, route, frameP95, frameMax, framesOver33, framesOver50, longTaskMax, lcp, cls })),
            averages: {
              frameP95: Number(average('frameP95').toFixed(2)),
              framesOver33: Number(average('framesOver33').toFixed(2)),
              framesOver50: Number(average('framesOver50').toFixed(2)),
              longTaskMax: Number(average('longTaskMax').toFixed(2)),
            },
          }, null, 2));
          NODE
        env:
          BENCHMARK_LABEL: ${{ matrix.label }}

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/fakhri-preview.pid ]; then
            kill "$(cat /tmp/fakhri-preview.pid)" || true
          fi
