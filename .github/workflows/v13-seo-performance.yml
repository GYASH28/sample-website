name: SEO and performance integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo-performance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply verified lockfile-only security remediation
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'optimize/ux-seo-performance-v13'
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile remediation needed"
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const before = JSON.parse(execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const beforeNano = before.packages?.['node_modules/nanoid'];
          const afterNano = after.packages?.['node_modules/nanoid'];
          if (beforeNano?.version !== '3.3.16' || afterNano?.version !== '3.3.18') {
            throw new Error(`Unexpected Nano ID remediation: ${beforeNano?.version} -> ${afterNano?.version}`);
          }
          const stripNano = (lock) => {
            const clone = structuredClone(lock);
            delete clone.packages?.['node_modules/nanoid'];
            return clone;
          };
          if (JSON.stringify(stripNano(before)) !== JSON.stringify(stripNano(after))) {
            throw new Error('npm audit fix changed more than the verified Nano ID lock entry');
          }
          console.log('Verified exact Nano ID 3.3.16 -> 3.3.18 registry remediation.');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: patch nanoid to 3.3.18"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Reinstall verified lockfile
        run: npm ci

      - name: Audit high severity dependencies
        run: node dependency-audit.cjs

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build and prerender public routes
        run: npm run build:prerender

      - name: Start preview server
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/v13-preview.log 2>&1 &
          echo $! > /tmp/v13-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/v13-preview.log
          exit 1

      - name: SEO and business identity integrity
        run: node seo-integrity-test.cjs

      - name: Bundle and scroll performance budgets
        run: node performance-budget-test.cjs

      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/v13-preview.pid ]; then
            kill "$(cat /tmp/v13-preview.pid)" || true
          fi
