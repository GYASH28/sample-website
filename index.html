    <meta name="theme-color" content="#FFF7EC" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("fakhri_theme");
          // Fakhri Mart is light-first. Dark mode is an explicit visitor
          // preference, never an automatic surprise inherited from the OS.
          const theme = stored === "dark" || stored === "light" ? stored : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute(
            "content",
            theme === "dark" ? "#171717" : "#FFF7EC",
          );
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
