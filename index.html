<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      (() => {
        try {
          const force = new URLSearchParams(window.location.search).get("intro") === "1";
          const seen = window.sessionStorage.getItem("fakhri_intro_v3") === "played";
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!reduced && (force || !seen)) {
            document.documentElement.classList.add("intro-booting");
            window.setTimeout(
              () => document.documentElement.classList.remove("intro-booting"),
              6000,
            );
          }
        } catch {
          document.documentElement.classList.add("intro-booting");
        }
      })();
    </script>
    <style>
      html.intro-booting,
      html.intro-booting body {
        background: #452735;
      }

      html.intro-booting body::before {
        position: fixed;
        z-index: 2147483646;
        inset: 0;
        background:
          radial-gradient(circle at 12% 22%, rgba(216, 137, 161, 0.18), transparent 32rem),
          linear-gradient(112deg, #3c202d 0 48%, #452735 48% 100%);
        content: "";
      }
    </style>
    <title>Fakhri Mart | Yarn Store & Craft Supplier</title>
    <meta
      name="description"
      content="Fakhri Mart offers yarns, crochet threads, macrame cords, embroidery threads, beads, purse accessories, bases, handles and craft essentials with all-India delivery and bulk enquiry support."
    />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="/assets/brand/fakhri-logo-180.png" />
    <link rel="apple-touch-icon" href="/assets/brand/fakhri-logo-180.png" />
    <link rel="shortcut icon" href="/assets/brand/fakhri-logo-180.png" />
    <link
      rel="preload"
      as="image"
      href="/assets/images/editorial/atelier-hero-960.avif"
      imagesrcset="/assets/images/editorial/atelier-hero-640.avif 640w, /assets/images/editorial/atelier-hero-960.avif 960w, /assets/images/editorial/atelier-hero.avif 1280w"
      imagesizes="(max-width: 48rem) calc(100vw - 2rem), 46vw"
      type="image/avif"
      fetchpriority="high"
    />

    <!-- Preconnect for WhatsApp (primary conversion) -->
    <link rel="dns-prefetch" href="https://wa.me" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fakhriyarns.vercel.app" />
    <meta property="og:site_name" content="Fakhri Mart" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Fakhri Mart | Yarn Store & Craft Supplier" />
    <meta property="og:description" content="Fakhri Mart offers yarns, crochet threads, macrame cords, embroidery threads, beads, purse accessories, bases, handles and craft essentials with all-India delivery and bulk enquiry support." />
    <meta property="og:image" content="https://fakhriyarns.vercel.app/assets/brand/fakhri-logo-640.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@fakhrimart53" />
    <meta property="twitter:title" content="Fakhri Mart | Yarn Store & Craft Supplier" />
    <meta property="twitter:description" content="Fakhri Mart offers yarns, crochet threads, macrame cords, embroidery threads, beads, purse accessories, bases, handles and craft essentials with all-India delivery and bulk enquiry support." />
    <meta property="twitter:image" content="https://fakhriyarns.vercel.app/assets/brand/fakhri-logo-640.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
