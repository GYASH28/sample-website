    <script>
      (() => {
        try {
          const force = new URLSearchParams(window.location.search).get("intro") === "1";
          const seen = window.sessionStorage.getItem("fakhri_intro_cinematic_v2") === "played";
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!reduced && (force || !seen)) {
            document.documentElement.classList.add("intro-booting");
            window.setTimeout(
              () => document.documentElement.classList.remove("intro-booting"),
              10000,
            );
          }
        } catch {
          document.documentElement.classList.add("intro-booting");
        }
      })();
    </script>
    <style>
      html.intro-booting,
      html.intro-booting body {
        background: #24131b;
      }

      html.intro-booting body::before {
        position: fixed;
        z-index: 2147483646;
        inset: 0;
        background:
          radial-gradient(circle at 13% 18%, rgba(216, 137, 161, 0.2), transparent 34rem),
          radial-gradient(circle at 86% 22%, rgba(42, 140, 130, 0.17), transparent 38rem),
          linear-gradient(112deg, #24131b, #452735);
        content: "";
      }
    </style>
